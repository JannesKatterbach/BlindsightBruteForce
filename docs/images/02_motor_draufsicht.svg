<svg xmlns="http://www.w3.org/2000/svg" width="940" height="665" viewBox="0 0 940 665" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<title>Motor im Stangenrahmen, Draufsicht</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1d2330"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<line x1="109.00" y1="120.00" x2="460.00" y2="120.00" stroke="#5b6475" stroke-width="0.8" stroke-dasharray="5 4"/>
<line x1="330.00" y1="42.00" x2="330.00" y2="627.00" stroke="#5b6475" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="464.00" y="124.00" font-size="13" text-anchor="start" fill="#5b6475">x</text>
<text x="335.00" y="42.00" font-size="13" text-anchor="start" fill="#5b6475">y</text>
<rect x="187.00" y="159.00" width="156.00" height="416.00" fill="#4e79a7" fill-opacity="0.18" stroke="#4e79a7" stroke-width="1.6"/>
<text x="265.00" y="367.00" font-size="14" text-anchor="middle" font-weight="bold" fill="#1d2330">Motorgehäuse</text>
<text x="265.00" y="385.00" font-size="12" text-anchor="middle" fill="#1d2330">Höhe (z) 10 mm</text>
<line x1="265.00" y1="159.00" x2="265.00" y2="146.00" stroke="#1d2330" stroke-width="2.5"/>
<rect x="226.00" y="94.00" width="78.00" height="52.00" fill="#e8a33d" stroke="#1d2330" stroke-width="1"/>
<text x="265.00" y="124.00" font-size="11" text-anchor="middle" fill="#1d2330">Zahnrad</text>
<circle cx="330.00" cy="120.00" r="32.50" fill="none" stroke="#1d2330" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="330.00" cy="120.00" r="26.00" fill="#2b2f36"/>
<line x1="187.00" y1="599.00" x2="343.00" y2="599.00" stroke="#1d2330" stroke-width="1.0" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="265.00" y="614.00" font-size="12" text-anchor="middle" fill="#1d2330">Breite (x) 12 mm</text>
<line x1="163.00" y1="159.00" x2="163.00" y2="575.00" stroke="#1d2330" stroke-width="1.0" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="156.00" y="356.12" font-size="12" text-anchor="end" fill="#1d2330">Tiefe (y,</text>
<text x="156.00" y="371.12" font-size="12" text-anchor="end" fill="#1d2330">Wellenrichtung)</text>
<text x="156.00" y="386.12" font-size="12" text-anchor="end" fill="#1d2330">32 mm</text>
<line x1="226.00" y1="74.00" x2="304.00" y2="74.00" stroke="#1d2330" stroke-width="1.0" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="265.00" y="68.00" font-size="12" text-anchor="middle" fill="#1d2330">Zahnrad Durchmesser 6 mm</text>
<line x1="265.00" y1="32.00" x2="330.00" y2="32.00" stroke="#1d2330" stroke-width="1.0" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="297.50" y="26.00" font-size="12" text-anchor="middle" fill="#1d2330">Achsabstand Zahnrad zu Stange 5 mm</text>
<line x1="265.00" y1="32.00" x2="265.00" y2="120.00" stroke="#5b6475" stroke-width="0.6" stroke-dasharray="2 2"/>
<line x1="330.00" y1="32.00" x2="330.00" y2="120.00" stroke="#5b6475" stroke-width="0.6" stroke-dasharray="2 2"/>
<line x1="210.00" y1="94.00" x2="210.00" y2="146.00" stroke="#1d2330" stroke-width="1.0" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="203.00" y="116.56" font-size="12" text-anchor="end" fill="#1d2330">Zahnrad Breite</text>
<text x="203.00" y="131.56" font-size="12" text-anchor="end" fill="#1d2330">4 mm</text>
<path d="M344.1,172.7 A54.6,54.6 0 0 0 382.7,134.1" fill="none" stroke="#c62828" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="376.80" y="182.40" font-size="12" text-anchor="start" fill="#c62828">Motorwinkel</text>
<circle cx="353.40" cy="96.60" r="2.20" fill="#1d2330"/>
<line x1="353.40" y1="96.60" x2="560.00" y2="48.50" stroke="#5b6475" stroke-width="0.8"/>
<text x="564.00" y="52.50" font-size="12" text-anchor="start" fill="#1d2330">Durchgangsloch ⌀ 5 mm (gestrichelt),</text>
<text x="564.00" y="67.50" font-size="12" text-anchor="start" fill="#1d2330">Stange + 2 x Radiales Lochspiel</text>
<circle cx="336.00" cy="122.00" r="2.20" fill="#1d2330"/>
<line x1="336.00" y1="122.00" x2="560.00" y2="107.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="564.00" y="111.00" font-size="12" text-anchor="start" fill="#1d2330">Gewindestange ⌀ 4 mm im Ursprung (0, 0)</text>
<text x="564.00" y="126.00" font-size="12" text-anchor="start" fill="#1d2330">des Motors. Um ihre Achse dreht der ganze</text>
<text x="564.00" y="141.00" font-size="12" text-anchor="start" fill="#1d2330">Motor (Motorwinkel)</text>
<circle cx="267.00" cy="152.50" r="2.20" fill="#1d2330"/>
<line x1="267.00" y1="152.50" x2="560.00" y2="204.50" stroke="#5b6475" stroke-width="0.8"/>
<text x="564.00" y="208.50" font-size="12" text-anchor="start" fill="#1d2330">Motorwelle in y Richtung. Zwischen Gehäuse</text>
<text x="564.00" y="223.50" font-size="12" text-anchor="start" fill="#1d2330">und Zahnrad 1 mm (Abstand Gehäuse zu Zahnrad)</text>
<circle cx="341.00" cy="161.00" r="2.20" fill="#1d2330"/>
<line x1="341.00" y1="161.00" x2="560.00" y2="269.50" stroke="#5b6475" stroke-width="0.8"/>
<text x="564.00" y="273.50" font-size="12" text-anchor="start" fill="#1d2330">Ecke des Gehäuses nahe der Stange. Es muss</text>
<text x="564.00" y="288.50" font-size="12" text-anchor="start" fill="#1d2330">0,2 mm Abstand zur eigenen Stange halten</text>
<text x="564.00" y="303.50" font-size="12" text-anchor="start" fill="#1d2330">(Eigenabstand Gehäuse zur Stange)</text>
<text x="560.00" y="354.00" font-size="12" text-anchor="start" fill="#1d2330">Das Zahnrad ist ein Quader (Durchmesser x Breite).</text>
<text x="560.00" y="369.00" font-size="12" text-anchor="start" fill="#1d2330">Zähne gibt es im Modell nicht, der Eingriff ins</text>
<text x="560.00" y="384.00" font-size="12" text-anchor="start" fill="#1d2330">Gewinde steckt nur im Achsabstand. Er ist so</text>
<text x="560.00" y="399.00" font-size="12" text-anchor="start" fill="#1d2330">gewählt, dass Zahnrad und Stange sich berühren</text>
<text x="560.00" y="414.00" font-size="12" text-anchor="start" fill="#1d2330">(3 mm Zahnradradius + 2 mm Stangenradius).</text>
<text x="30.00" y="645.00" font-size="11" text-anchor="start" fill="#5b6475" font-style="italic">Maßstäblich mit den Standardwerten (N20 mit Encoder). Gezeigt ist der Motorwinkel 0 Grad, das Zahnrad liegt dann in -x der Stange, das Gehäuse in -y.</text>
</svg>
