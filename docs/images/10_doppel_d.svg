<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<title>Doppel D Abflachung im Querschnitt</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1d2330"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<path d="M201.00,128.39 L201.00,191.61 A60.00,60.00 0 0 1 99.00,191.61 L99.00,128.39 A60.00,60.00 0 0 1 201.00,128.39 Z" fill="#2b2f36" stroke="none"/>
<circle cx="150.00" cy="160.00" r="60.00" fill="none" stroke="#5b6475" stroke-width="1" stroke-dasharray="4 3"/>
<text x="150.00" y="30.00" font-size="14" text-anchor="middle" font-weight="bold" fill="#1d2330">Stange M4 mit Doppel D</text>
<rect x="562.00" y="52.00" width="216.00" height="216.00" fill="#f4c542" stroke="#1d2330"/>
<path d="M722.50,127.97 L722.50,192.03 A61.50,61.50 0 0 1 617.50,192.03 L617.50,127.97 A61.50,61.50 0 0 1 722.50,127.97 Z" fill="#ffffff" stroke="#1d2330" stroke-width="1"/>
<path d="M721.00,128.39 L721.00,191.61 A60.00,60.00 0 0 1 619.00,191.61 L619.00,128.39 A60.00,60.00 0 0 1 721.00,128.39 Z" fill="#2b2f36" stroke="none"/>
<circle cx="670.00" cy="160.00" r="60.00" fill="none" stroke="#5b6475" stroke-width="1" stroke-dasharray="4 3"/>
<text x="670.00" y="30.00" font-size="14" text-anchor="middle" font-weight="bold" fill="#1d2330">in der Sicherung</text>
<line x1="99.00" y1="244.00" x2="201.00" y2="244.00" stroke="#1d2330" stroke-width="1.0" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="150.00" y="259.00" font-size="12" text-anchor="middle" fill="#1d2330">Schlüsselweite 3,4 mm</text>
<line x1="66.00" y1="100.00" x2="66.00" y2="220.00" stroke="#1d2330" stroke-width="1.0" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="59.00" y="164.00" font-size="12" text-anchor="end" fill="#1d2330">Ø 4</text>
<text x="290.00" y="130.00" font-size="12" text-anchor="start" fill="#1d2330">Zwei parallele Flächen, wie bei einem</text>
<text x="290.00" y="145.00" font-size="12" text-anchor="start" fill="#1d2330">Schraubenschlüssel. Gestrichelt das</text>
<text x="290.00" y="160.00" font-size="12" text-anchor="start" fill="#1d2330">ursprüngliche Gewinde. Zwischen den</text>
<text x="290.00" y="175.00" font-size="12" text-anchor="start" fill="#1d2330">Flächen bleibt Gewinde stehen und</text>
<text x="290.00" y="190.00" font-size="12" text-anchor="start" fill="#1d2330">greift weiter in die Mutter.</text>
<text x="670.00" y="300.00" font-size="12" text-anchor="middle" fill="#1d2330">Die Sicherung steht fest. Die Flächen liegen an und</text>
<text x="670.00" y="315.00" font-size="12" text-anchor="middle" fill="#1d2330">verhindern das Drehen, auf und ab gleitet die Stange.</text>
</svg>
