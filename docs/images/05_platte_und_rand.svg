<text x="156.00" y="510.00" font-size="11" text-anchor="start" fill="#1d2330">13 mm = Sperrrand 3 + Randbereich 10</text>
<text x="100.00" y="550.00" font-size="12" text-anchor="start" fill="#5b6475">(0, 0) Ursprung unten links</text>
<circle cx="568.00" cy="90.00" r="2.20" fill="#1d2330"/>
<line x1="568.00" y1="90.00" x2="630.00" y2="90.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="634.00" y="94.00" font-size="12" text-anchor="start" fill="#1d2330">Sperrrand für alle Bauteile 3 mm.</text>
<text x="634.00" y="109.00" font-size="12" text-anchor="start" fill="#1d2330">Kein Bauteil kommt näher an den Plattenrand</text>
<circle cx="554.00" cy="194.00" r="2.20" fill="#1d2330"/>
<line x1="554.00" y1="194.00" x2="630.00" y2="178.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="634.00" y="182.00" font-size="12" text-anchor="start" fill="#1d2330">Randbereich nur für Motoren 10 mm</text>
<text x="634.00" y="197.00" font-size="12" text-anchor="start" fill="#1d2330">(Breite des Randbereichs). Motoren und</text>
<text x="634.00" y="212.00" font-size="12" text-anchor="start" fill="#1d2330">Zahnräder dürfen hinein, Löcher nicht</text>
<circle cx="564.00" cy="282.00" r="2.20" fill="#1d2330"/>
<line x1="564.00" y1="282.00" x2="630.00" y2="290.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="634.00" y="294.00" font-size="12" text-anchor="start" fill="#1d2330">Dieser Motor ragt in den Randbereich, das ist</text>
<text x="634.00" y="309.00" font-size="12" text-anchor="start" fill="#1d2330">erlaubt. Das Ziel Kleiner Rand hält solche</text>
<text x="634.00" y="324.00" font-size="12" text-anchor="start" fill="#1d2330">Überstände möglichst klein</text>
<circle cx="528.00" cy="386.00" r="2.20" fill="#1d2330"/>
<line x1="528.00" y1="386.00" x2="630.00" y2="394.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="634.00" y="398.00" font-size="12" text-anchor="start" fill="#1d2330">Lochbereich (gestrichelt). Jede Stange liegt</text>
<text x="634.00" y="413.00" font-size="12" text-anchor="start" fill="#1d2330">ganz darin, also mindestens 13 mm vom</text>
<text x="634.00" y="428.00" font-size="12" text-anchor="start" fill="#1d2330">Plattenrand entfernt</text>
