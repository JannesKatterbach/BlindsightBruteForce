<text x="654.00" y="68.00" font-size="12" text-anchor="start" fill="#1d2330">Gewindestange M4 ausgefahren (gestrichelt)</text>
<circle cx="340.20" cy="340.00" r="2.20" fill="#1d2330"/>
<line x1="340.20" y1="340.00" x2="650.00" y2="208.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="654.00" y="212.00" font-size="12" text-anchor="start" fill="#1d2330">Gewindestange M4, oben Doppel D (Schlüsselweite</text>
<text x="654.00" y="227.00" font-size="12" text-anchor="start" fill="#1d2330">3,4 mm) über 46,5 mm, sonst volles Gewinde</text>
<circle cx="357.00" cy="346.00" r="2.20" fill="#1d2330"/>
<line x1="357.00" y1="346.00" x2="650.00" y2="304.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="654.00" y="308.00" font-size="12" text-anchor="start" fill="#1d2330">Sicherung. Geschlossene Oberseite des Gehäuses</text>
<text x="654.00" y="323.00" font-size="12" text-anchor="start" fill="#1d2330">mit Doppel D Schlitz, hält die Stange gegen Drehen</text>
<circle cx="341.40" cy="394.00" r="2.20" fill="#1d2330"/>
<line x1="341.40" y1="394.00" x2="650.00" y2="394.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="654.00" y="398.00" font-size="12" text-anchor="start" fill="#1d2330">Offenes Ende des Rohres mit M4 Innengewinde,</text>
<text x="654.00" y="413.00" font-size="12" text-anchor="start" fill="#1d2330">8 mm lang, nach dem Druck eingeschnitten</text>
<circle cx="354.00" cy="478.00" r="2.20" fill="#1d2330"/>
<line x1="354.00" y1="478.00" x2="650.00" y2="496.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="654.00" y="500.00" font-size="12" text-anchor="start" fill="#1d2330">Rohr, gedruckt, dreht. Innen frei für die Stange</text>
<circle cx="291.00" cy="598.00" r="2.20" fill="#1d2330"/>
<line x1="291.00" y1="598.00" x2="650.00" y2="592.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="654.00" y="596.00" font-size="12" text-anchor="start" fill="#1d2330">Gehäuse, gedruckt. Außen 13,8 x 11,8 mm, Wand 0,8 mm,</text>
<text x="654.00" y="611.00" font-size="12" text-anchor="start" fill="#1d2330">ist die Kachel</text>
<circle cx="337.20" cy="712.00" r="2.20" fill="#1d2330"/>
<line x1="337.20" y1="712.00" x2="650.00" y2="688.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="654.00" y="692.00" font-size="12" text-anchor="start" fill="#1d2330">D Bohrung, die D Welle des N20 ist der Key.</text>
<text x="654.00" y="707.00" font-size="12" text-anchor="start" fill="#1d2330">Nur Drehmoment, 0,5 mm Luft über dem Wellenende</text>
<circle cx="351.00" cy="754.00" r="2.20" fill="#1d2330"/>
<line x1="351.00" y1="754.00" x2="650.00" y2="772.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="654.00" y="776.00" font-size="12" text-anchor="start" fill="#1d2330">Rohr steht auf der Getriebeplatte und gibt die</text>
<text x="654.00" y="791.00" font-size="12" text-anchor="start" fill="#1d2330">Axialkraft dorthin ab, Aussparung für den Lagerbund</text>
<circle cx="366.00" cy="850.00" r="2.20" fill="#1d2330"/>
<line x1="366.00" y1="850.00" x2="650.00" y2="856.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="654.00" y="860.00" font-size="12" text-anchor="start" fill="#1d2330">N20 mit Encoder, die Tasche hält das Drehmoment</text>
<circle cx="384.00" cy="688.00" r="2.20" fill="#1d2330"/>
<line x1="384.00" y1="688.00" x2="650.00" y2="916.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="654.00" y="920.00" font-size="12" text-anchor="start" fill="#1d2330">Nachbarkachel, Spalt 0,2 mm</text>
<circle cx="294.00" cy="952.00" r="2.20" fill="#1d2330"/>
<line x1="294.00" y1="952.00" x2="650.00" y2="976.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="654.00" y="980.00" font-size="12" text-anchor="start" fill="#1d2330">Boden der Wanne mit Kabelschlitz</text>
<text x="40.00" y="1006.00" font-size="11" text-anchor="start" fill="#5b6475" font-style="italic">Schnitt durch eine Kachel, maßstäblich nach cad/onshape/rohrantrieb.fs mit Hub 40 mm. Eingefahren ist die Spitze bündig mit der Oberfläche.</text>
