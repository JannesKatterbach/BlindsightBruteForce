<text x="40.00" y="714.00" font-size="11" text-anchor="start" fill="#5b6475" font-style="italic">Schnitt durch eine Einheit, maßstäblich mit vorläufigen Konstruktionsannahmen (siehe docs/MOTORVARIANTE_ROHR.md). Eingefahren ist die Spitze bündig mit G0.</text>
