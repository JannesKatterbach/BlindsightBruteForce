<text x="654.00" y="68.00" font-size="12" text-anchor="start" fill="#1d2330">Gewindestange M4 ausgefahren (gestrichelt)</text>
<circle cx="340.20" cy="340.00" r="2.20" fill="#1d2330"/>
<line x1="340.20" y1="340.00" x2="650.00" y2="220.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="654.00" y="224.00" font-size="12" text-anchor="start" fill="#1d2330">Gewindestange M4, oben mit Doppel D</text>
<text x="654.00" y="239.00" font-size="12" text-anchor="start" fill="#1d2330">(Schlüsselweite 3,4 mm) über 46,5 mm,</text>
<text x="654.00" y="254.00" font-size="12" text-anchor="start" fill="#1d2330">unten mit vollem Gewinde</text>
<circle cx="357.00" cy="346.00" r="2.20" fill="#1d2330"/>
<line x1="357.00" y1="346.00" x2="650.00" y2="316.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="654.00" y="320.00" font-size="12" text-anchor="start" fill="#1d2330">Deckel mit Führung, gedruckt. Doppel D Schlitz,</text>
<text x="654.00" y="335.00" font-size="12" text-anchor="start" fill="#1d2330">hält die Stange gegen Drehen. Oberfläche</text>
<circle cx="351.00" cy="390.40" r="2.20" fill="#1d2330"/>
<line x1="351.00" y1="390.40" x2="650.00" y2="400.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="654.00" y="404.00" font-size="12" text-anchor="start" fill="#1d2330">Zwei Muttern M4 in der Sechskanttasche</text>
<text x="654.00" y="419.00" font-size="12" text-anchor="start" fill="#1d2330">des Rohrkopfs, drehen mit dem Rohr</text>
<circle cx="358.80" cy="448.00" r="2.20" fill="#1d2330"/>
<line x1="358.80" y1="448.00" x2="650.00" y2="484.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="654.00" y="488.00" font-size="12" text-anchor="start" fill="#1d2330">Rohr, gedruckt. Dreht, 45° Übergänge</text>
<text x="654.00" y="503.00" font-size="12" text-anchor="start" fill="#1d2330">für den Druck ohne Stützen</text>
<circle cx="294.00" cy="538.00" r="2.20" fill="#1d2330"/>
<line x1="294.00" y1="538.00" x2="650.00" y2="568.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="654.00" y="572.00" font-size="12" text-anchor="start" fill="#1d2330">Gehäuse, gedruckt. Außen 13,8 x 11,8 mm,</text>
<text x="654.00" y="587.00" font-size="12" text-anchor="start" fill="#1d2330">Wand 0,8 mm, ist die Kachel</text>
<circle cx="349.50" cy="730.60" r="2.20" fill="#1d2330"/>
<line x1="349.50" y1="730.60" x2="650.00" y2="664.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="654.00" y="668.00" font-size="12" text-anchor="start" fill="#1d2330">Kugellager MR85ZZ (5 x 8 x 2,5) im Zwischen-</text>
<text x="654.00" y="683.00" font-size="12" text-anchor="start" fill="#1d2330">boden, nimmt die Axialkraft auf</text>
<circle cx="337.20" cy="706.00" r="2.20" fill="#1d2330"/>
<line x1="337.20" y1="706.00" x2="650.00" y2="736.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="654.00" y="740.00" font-size="12" text-anchor="start" fill="#1d2330">D Bohrung im Rohr, die D Welle des Motors</text>
<text x="654.00" y="755.00" font-size="12" text-anchor="start" fill="#1d2330">ist der Key. Nur Drehmoment, 0,5 mm Luft</text>
<text x="654.00" y="770.00" font-size="12" text-anchor="start" fill="#1d2330">über dem Wellenende</text>
<circle cx="366.00" cy="838.00" r="2.20" fill="#1d2330"/>
<line x1="366.00" y1="838.00" x2="650.00" y2="832.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="654.00" y="836.00" font-size="12" text-anchor="start" fill="#1d2330">N20 mit Encoder, Getriebe oben am</text>
<text x="654.00" y="851.00" font-size="12" text-anchor="start" fill="#1d2330">Zwischenboden, Tasche hält das Drehmoment</text>
<circle cx="384.00" cy="688.00" r="2.20" fill="#1d2330"/>
<line x1="384.00" y1="688.00" x2="650.00" y2="916.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="654.00" y="920.00" font-size="12" text-anchor="start" fill="#1d2330">Nachbarkachel, Spalt 0,2 mm</text>
<circle cx="294.00" cy="946.00" r="2.20" fill="#1d2330"/>
<line x1="294.00" y1="946.00" x2="650.00" y2="976.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="654.00" y="980.00" font-size="12" text-anchor="start" fill="#1d2330">Boden des Grundrahmens mit Kabelschlitz</text>
<text x="40.00" y="1000.00" font-size="11" text-anchor="start" fill="#5b6475" font-style="italic">Schnitt durch eine Kachel, maßstäblich nach cad/onshape/rohrantrieb.fs mit Hub 40 mm. Eingefahren ist die Spitze bündig mit dem Deckel.</text>
