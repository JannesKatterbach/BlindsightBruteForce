<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="578" viewBox="0 0 1060 578" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<title>Stangenlänge eingefahren und ausgefahren</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1d2330"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="300.00" y="24.00" font-size="16" text-anchor="middle" font-weight="bold" fill="#1d2330">eingefahren</text>
<rect x="180.00" y="225.60" width="112.00" height="19.20" fill="#8f96a3" stroke="#1d2330" stroke-width="0.6"/>
<rect x="308.00" y="225.60" width="82.00" height="19.20" fill="#8f96a3" stroke="#1d2330" stroke-width="0.6"/>
<text x="170.00" y="235.60" font-size="15" text-anchor="end" font-weight="bold" fill="#1d2330">G0</text>
