<rect x="279.20" y="260.80" width="184.00" height="92.00" fill="none" stroke="#c62828" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="40.00" y="612.00" font-size="12" text-anchor="start" fill="#5b6475">(0, 0)</text>
<text x="592.00" y="612.00" font-size="12" text-anchor="end" fill="#5b6475">x = 120 mm</text>
<rect x="40.00" y="622.00" width="14.00" height="14.00" fill="#4e79a7" fill-opacity="0.5" stroke="#4e79a7"/>
<text x="60.00" y="634.00" font-size="12" text-anchor="start" fill="#1d2330">Motor auf G1</text>
<rect x="165.00" y="622.00" width="14.00" height="14.00" fill="#f28e2b" fill-opacity="0.5" stroke="#f28e2b"/>
<text x="185.00" y="634.00" font-size="12" text-anchor="start" fill="#1d2330">Motor auf G2</text>
<circle cx="297.00" cy="629.00" r="4.00" fill="#2b2f36"/>
<text x="306.00" y="634.00" font-size="12" text-anchor="start" fill="#1d2330">Stange im Loch</text>
<text x="622.00" y="50.00" font-size="14" text-anchor="start" font-weight="bold" fill="#1d2330">Was man sieht</text>
<text x="622.00" y="74.00" font-size="12" text-anchor="start" fill="#1d2330">20 Löcher im Muster Quadrat,</text>
<text x="622.00" y="89.00" font-size="12" text-anchor="start" fill="#1d2330">Lochabstand 20 mm.</text>
<text x="622.00" y="104.00" font-size="12" text-anchor="start" fill="#1d2330"></text>
<text x="622.00" y="119.00" font-size="12" text-anchor="start" fill="#1d2330">Die Gehäuse überlappen sich in der</text>
<text x="622.00" y="134.00" font-size="12" text-anchor="start" fill="#1d2330">Draufsicht. Sie liegen aber auf</text>
<text x="622.00" y="149.00" font-size="12" text-anchor="start" fill="#1d2330">verschiedenen Ebenen (Farbe) und</text>
<text x="622.00" y="164.00" font-size="12" text-anchor="start" fill="#1d2330">stoßen im Raum nicht zusammen.</text>
<text x="622.00" y="179.00" font-size="12" text-anchor="start" fill="#1d2330"></text>
<text x="622.00" y="194.00" font-size="12" text-anchor="start" fill="#1d2330">Alle Motoren sind um 75 Grad gedreht.</text>
<text x="622.00" y="209.00" font-size="12" text-anchor="start" fill="#1d2330">Rot gestrichelt ein Block. Ein Motor</text>
<text x="622.00" y="224.00" font-size="12" text-anchor="start" fill="#1d2330">auf G1 und einer auf G2 wechseln</text>
<text x="622.00" y="239.00" font-size="12" text-anchor="start" fill="#1d2330">sich ab, der Block wiederholt sich</text>
<text x="622.00" y="254.00" font-size="12" text-anchor="start" fill="#1d2330">über die ganze Platte.</text>
<text x="622.00" y="269.00" font-size="12" text-anchor="start" fill="#1d2330"></text>
<text x="622.00" y="284.00" font-size="12" text-anchor="start" fill="#1d2330">Gerechnet mit den Standardwerten</text>
<text x="622.00" y="299.00" font-size="12" text-anchor="start" fill="#1d2330">(Platte 120 x 120 mm, Stange 4 mm,</text>
<text x="622.00" y="314.00" font-size="12" text-anchor="start" fill="#1d2330">Motor N20 mit Encoder 12 x 32 mm,</text>
<text x="622.00" y="329.00" font-size="12" text-anchor="start" fill="#1d2330">3 Motorebenen, Muster Quadrat, so</text>
<text x="622.00" y="344.00" font-size="12" text-anchor="start" fill="#1d2330">viele Löcher wie passen, Lochabstand</text>
<text x="622.00" y="359.00" font-size="12" text-anchor="start" fill="#1d2330">so klein wie möglich).</text>
</svg>
