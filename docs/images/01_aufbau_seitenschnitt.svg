<text x="143.00" y="131.56" font-size="12" text-anchor="end" fill="#1d2330">Hub</text>
<text x="143.00" y="146.56" font-size="12" text-anchor="end" fill="#1d2330">50 mm</text>
<circle cx="530.00" cy="114.00" r="2.20" fill="#1d2330"/>
<line x1="530.00" y1="114.00" x2="690.00" y2="102.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="694.00" y="106.00" font-size="12" text-anchor="start" fill="#1d2330">ausgefahren (gestrichelt). Jede Stange erreicht</text>
<text x="694.00" y="121.00" font-size="12" text-anchor="start" fill="#1d2330">denselben Hub über G0, egal auf welcher Ebene</text>
<text x="694.00" y="136.00" font-size="12" text-anchor="start" fill="#1d2330">ihr Motor sitzt (Maximaler Hub über G0)</text>
<circle cx="637.00" cy="219.00" r="2.20" fill="#1d2330"/>
<line x1="637.00" y1="219.00" x2="690.00" y2="198.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="694.00" y="202.00" font-size="12" text-anchor="start" fill="#1d2330">G0, die Lochplatte oben, Dicke 6 mm.</text>
<text x="694.00" y="217.00" font-size="12" text-anchor="start" fill="#1d2330">Ihre Oberseite ist z = 0, nach unten wird z negativ</text>
<circle cx="637.00" cy="272.40" r="2.20" fill="#1d2330"/>
<line x1="637.00" y1="272.40" x2="690.00" y2="261.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="694.00" y="265.00" font-size="12" text-anchor="start" fill="#1d2330">G1 bis G3, die Motorebenen, Dicke 1,6 mm,</text>
<text x="694.00" y="280.00" font-size="12" text-anchor="start" fill="#1d2330">je 20 mm Abstand (Einheitlicher Ebenenabstand)</text>
<circle cx="537.50" cy="332.40" r="2.20" fill="#1d2330"/>
<line x1="537.50" y1="332.40" x2="690.00" y2="321.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="694.00" y="325.00" font-size="12" text-anchor="start" fill="#1d2330">Durchgangsloch ⌀ 5 mm in jeder Ebene, durch die</text>
<text x="694.00" y="340.00" font-size="12" text-anchor="start" fill="#1d2330">eine Stange läuft (Stange 4 mm + 2 x 0,5 mm Lochspiel)</text>
<circle cx="527.00" cy="363.00" r="2.20" fill="#1d2330"/>
<line x1="527.00" y1="363.00" x2="690.00" y2="366.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="694.00" y="370.00" font-size="12" text-anchor="start" fill="#1d2330">Motorgehäuse, steht auf seiner Ebene</text>
<text x="694.00" y="385.00" font-size="12" text-anchor="start" fill="#1d2330">(Montage. Motor steht auf der Ebene)</text>
<circle cx="519.00" cy="380.00" r="2.20" fill="#1d2330"/>
<line x1="519.00" y1="380.00" x2="690.00" y2="411.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="694.00" y="415.00" font-size="12" text-anchor="start" fill="#1d2330">Zahnrad ⌀ 6 mm auf der Motorwelle, 5 mm</text>
<text x="694.00" y="430.00" font-size="12" text-anchor="start" fill="#1d2330">über der Ebene. Es greift ins Gewinde und schiebt</text>
<text x="694.00" y="445.00" font-size="12" text-anchor="start" fill="#1d2330">die Stange auf und ab</text>
<circle cx="536.00" cy="495.00" r="2.20" fill="#1d2330"/>
<line x1="536.00" y1="495.00" x2="690.00" y2="486.00" stroke="#5b6475" stroke-width="0.8"/>
<text x="694.00" y="490.00" font-size="12" text-anchor="start" fill="#1d2330">Gewindestange eingefahren, die Spitze bündig mit</text>
<text x="694.00" y="505.00" font-size="12" text-anchor="start" fill="#1d2330">G0. Sie hängt durch alle Ebenen darunter und</text>
<text x="694.00" y="520.00" font-size="12" text-anchor="start" fill="#1d2330">braucht dort überall ein Loch</text>
<text x="690.00" y="546.00" font-size="11" text-anchor="start" fill="#5b6475" font-style="italic">Schematisch. z ist maßstäblich mit den Standardwerten,</text>
<text x="690.00" y="559.75" font-size="11" text-anchor="start" fill="#5b6475" font-style="italic">die drei Einheiten sind in x auseinandergezogen.</text>
