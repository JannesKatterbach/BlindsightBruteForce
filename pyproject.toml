[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "blindsight"
dynamic = ["version"]  # from blindsight.__version__
description = "Project Blindsight, geometric optimizer for motors and threaded rods"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
blindsight = "blindsight.web.server:main"  # web UI
blindsight-cli = "blindsight.cli:main"  # command line

[tool.setuptools.dynamic]
version = { attr = "blindsight.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blindsight = ["web/static/*", "web/static/**/*", "i18n/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
